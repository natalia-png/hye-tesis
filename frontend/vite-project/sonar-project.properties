# SonarCloud — Plataforma H&E Arquitectos
sonar.projectKey=natalia-png_hye-tesis
sonar.organization=natalia-png

sonar.sources=src
sonar.exclusions=src/__mocks__/**,src/__tests__/**,android/**,node_modules/**,coverage/**

sonar.tests=src/__tests__
sonar.test.inclusions=src/__tests__/**/*.test.js,src/__tests__/**/*.test.jsx

# Reporte de cobertura generado por Jest (lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Excluir de cobertura: páginas React, hooks Firebase y componentes UI
# (requieren testing de integración, no pruebas unitarias)
sonar.coverage.exclusions=src/pages/**,src/hooks/**,src/components/**,src/app/**,src/lib/**,src/*.jsx,src/*.tsx
